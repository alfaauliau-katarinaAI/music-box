name: Sync Google Apps Script
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-apps-script.yml'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        run: node tests/check.js && node tests/functional.js
      - name: Restore clasp credentials from Secrets
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing CLASPRC_JSON secret'; exit 1; }
          test -n "$CLASP_JSON" || { echo 'Missing CLASP_JSON secret'; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          chmod 600 "$HOME/.clasprc.json" .clasp.json
          node -e "const fs=require('fs'); for(const [k,p] of [['CLASPRC_JSON',process.env.HOME+'/.clasprc.json'],['CLASP_JSON','.clasp.json']]) { let v; try {v=JSON.parse(fs.readFileSync(p,'utf8'));}catch(e){console.error(k+' must contain valid JSON (not the ls output or shell prompt)');process.exit(1);} if(!v || typeof v!=='object'){console.error(k+' must contain a JSON object');process.exit(1);} if(k==='CLASP_JSON' && (!v.scriptId || v.rootDir!=='src')){console.error('CLASP_JSON needs scriptId and rootDir src');process.exit(1);} }"
      - name: Verify Workspace Google account
        shell: bash
        run: |
          npx --yes @google/clasp show-authorized-user --json > /tmp/musicbox-auth.json
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/musicbox-auth.json','utf8'));const ok=!!a.loggedIn && typeof a.email==='string' && a.email.toLowerCase().endsWith('@shopeemobile-external.com');console.log('Authorized Google account belongs to required Workspace domain: '+ok);if(!ok){console.error('WRONG_GOOGLE_ACCOUNT: reconnect clasp with company Google account before deployment.');process.exit(1)}"
      - name: Select exact Music Box Script ID confirmed by owner
        shell: bash
        env:
          MUSIC_BOX_SCRIPT_ID: 17z7eVUKR5KVlLtlTFLOhJ5To_Ih8oX0t9mEvhGw0duF3YksmH6Sy5aUi
        run: |
          node -e "const fs=require('fs');const id=process.env.MUSIC_BOX_SCRIPT_ID;const config=JSON.parse(fs.readFileSync('.clasp.json','utf8'));config.scriptId=id;config.rootDir='src';fs.writeFileSync('.clasp.json',JSON.stringify(config));console.log('Selected owner-confirmed Script ID; length: '+id.length)"
      - name: Push to Apps Script HEAD
        run: npx --yes @google/clasp push --force
